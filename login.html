<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueLess - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef4ff;
    font-family:Arial,sans-serif;
}

.container{
    width:90%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    color:#1769e0;
    font-size:30px;
    font-weight:bold;
}

h2{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:none;
    border-radius:10px;
    background:#1769e0;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0d52b8;
}

.message{
    text-align:center;
    margin-top:15px;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#1769e0;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        QUEUELESS ✈️
    </div>

    <h2>Customer Login</h2>

    <p class="subtitle">
        Login with your email and password
    </p>

    <label>Email</label>

    <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
    >

    <label>Password</label>

    <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
    >

    <button id="loginButton" onclick="loginCustomer()">
        LOGIN
    </button>

    <div id="message" class="message"></div>

    <div class="register">
        New customer?
        <a href="register.html">Create an account</a>
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://bqnkuxawnksjufkjkabv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_J41mt6w74FTBFBN8nj5LnQ_8ynQULAo";

const queueDB = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


async function loginCustomer(){

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("loginButton");

    const email =
        emailInput.value.trim().toLowerCase();

    const password =
        passwordInput.value;


    if(!email || !password){

        message.textContent =
            "Please enter your email and password.";

        return;
    }


    button.disabled = true;

    button.textContent = "LOGGING IN...";

    message.textContent = "";


    try {

        const { data, error } =
            await queueDB.auth.signInWithPassword({
                email: email,
                password: password
            });


        console.log("LOGIN RESULT:", data);
        console.log("LOGIN ERROR:", error);


        if(error){

            message.textContent =
                "Login failed: " + error.message;

            button.disabled = false;

            button.textContent = "LOGIN";

            return;
        }


        if(!data || !data.session){

            message.textContent =
                "Login completed, but no session was created.";

            button.disabled = false;

            button.textContent = "LOGIN";

            return;
        }


        message.textContent =
            "Login successful!";


        window.location.href =
            "dashboard.html";

    }

    catch(err){

        console.error("LOGIN EXCEPTION:", err);

        message.textContent =
            "Login error: " + err.message;

        button.disabled = false;

        button.textContent = "LOGIN";
    }

}

</script>

</body>
</html>
