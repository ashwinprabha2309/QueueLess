<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QueueLess - Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef4ff;
    font-family:Arial,sans-serif;
}

.container{
    width:90%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    color:#1769e0;
    font-size:30px;
    font-weight:bold;
}

h2{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#666;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:none;
    border-radius:10px;
    background:#1769e0;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.message{
    text-align:center;
    margin-top:15px;
}

.error{
    color:#d00;
}

.success{
    color:#148a35;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">QUEUELESS ✈️</div>

    <h2>Set New Password</h2>

    <p class="subtitle">
        Enter your new QueueLess password
    </p>

    <label>New Password</label>

    <input
        id="password"
        type="password"
        placeholder="Enter new password"
    >

    <label>Confirm Password</label>

    <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
    >

    <button onclick="updatePassword()">
        UPDATE PASSWORD
    </button>

    <div id="message" class="message"></div>

</div>

<script>

const SUPABASE_URL =
    "https://bqnkuxawnksjufkjkabv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_J41mt6w74FTBFBN8nj5LnQ_8ynQULAo";

const queueDB = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


async function updatePassword(){

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if(!password || !confirmPassword){

        message.className = "message error";
        message.textContent =
            "Please enter both password fields.";

        return;
    }


    if(password.length < 6){

        message.className = "message error";
        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    if(password !== confirmPassword){

        message.className = "message error";
        message.textContent =
            "Passwords do not match.";

        return;
    }


    message.className = "message";
    message.textContent =
        "Updating password...";


    const { error } =
        await queueDB.auth.updateUser({
            password: password
        });


    if(error){

        console.error(error);

        message.className = "message error";
        message.textContent =
            "Password update failed: " + error.message;

        return;
    }


    message.className = "message success";
    message.textContent =
        "Password updated successfully!";


    setTimeout(function(){

        window.location.href =
            "login.html";

    },1500);

}

</script>

</body>
</html>
