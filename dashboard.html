<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QueueLess - Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    .logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: 25px auto;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .welcome h3 {
      margin-top: 0;
    }

    .join-button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .section-title {
      margin-bottom: 12px;
    }

    .queue-card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .token {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .place {
      font-size: 17px;
      font-weight: bold;
    }

    .details {
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
    }

    .waiting {
      background: #fef3c7;
      color: #92400e;
    }

    .serving {
      background: #dcfce7;
      color: #166534;
    }

    .served {
      background: #e5e7eb;
      color: #374151;
    }

    .view-button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h2>QueueLess</h2>

  <button class="logout" onclick="logout()">
    Logout
  </button>
</header>


<div class="container">

  <div class="welcome">
    <h3 id="welcomeName">Welcome!</h3>

    <div id="emailText">
      Loading account...
    </div>
  </div>


  <button class="join-button" onclick="joinAnotherQueue()">
    + JOIN ANOTHER QUEUE
  </button>


  <h3 class="section-title">
    My Queues
  </h3>


  <div id="queueList">
    <div class="loading">
      Loading your queues...
    </div>
  </div>

</div>


<script>

  // SUPABASE
  const SUPABASE_URL =
    "https://bqnkuxawnksjufkjkabv.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_J41mt6w74FTBFBN8nj5LnQ_8ynQULAo";


  const queueDB = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  let currentUser = null;


  // LOAD ACCOUNT
  async function loadAccount() {

    const {
      data: {
        user
      },
      error
    } = await queueDB.auth.getUser();


    if (error || !user) {

      window.location.href = "login.html";
      return;

    }


    currentUser = user;


    document.getElementById("emailText")
      .textContent = user.email;


    document.getElementById("welcomeName")
      .textContent = "Welcome to QueueLess!";


    loadQueues();
  }


  // LOAD ALL CUSTOMER QUEUES
  async function loadQueues() {

    const queueList =
      document.getElementById("queueList");


    const {
      data,
      error
    } = await queueDB
      .from("queue_customers")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("joined_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      queueList.innerHTML = `
        <div class="empty">
          Unable to load your queues.
          <br><br>
          ${error.message}
        </div>
      `;

      return;
    }


    if (!data || data.length === 0) {

      queueList.innerHTML = `
        <div class="empty">
          <h3>No queues yet</h3>
          <p>
            Join a queue and it will appear here.
          </p>
        </div>
      `;

      return;
    }


    queueList.innerHTML = "";


    data.forEach(queue => {

      const card =
        document.createElement("div");

      card.className = "queue-card";


      let statusClass = queue.status;

      let statusText =
        queue.status.toUpperCase();


      if (queue.status === "waiting") {
        statusText = "WAITING";
      }

      if (queue.status === "serving") {
        statusText = "NOW SERVING";
      }

      if (queue.status === "served") {
        statusText = "COMPLETED";
      }


      card.innerHTML = `

        <div class="token">
          ✈️ ${queue.token}
        </div>

        <div class="place">
          ${escapeHTML(queue.place)}
        </div>

        <div class="details">

          Estimated wait:
          ${queue.wait || 0} minutes

          <br>

          Joined:
          ${formatDate(queue.joined_at)}

        </div>

        <div class="status ${statusClass}">
          ${statusText}
        </div>

        <button
          class="view-button"
          onclick="openQueue('${queue.id}')">

          VIEW QUEUE

        </button>

      `;


      queueList.appendChild(card);

    });

  }


  // OPEN SELECTED QUEUE
  function openQueue(queueId) {

    localStorage.setItem(
      "selectedQueueId",
      queueId
    );


    window.location.href =
      "queue.html";

  }


  // JOIN ANOTHER QUEUE
  function joinAnotherQueue() {

    window.location.href =
      "location.html";

  }


  // LOGOUT
  async function logout() {

    await queueDB.auth.signOut();

    localStorage.removeItem(
      "selectedQueueId"
    );

    window.location.href =
      "login.html";

  }


  // FORMAT DATE
  function formatDate(dateString) {

    if (!dateString) return "Unknown";

    const date =
      new Date(dateString);


    return date.toLocaleString();

  }


  // BASIC HTML SAFETY
  function escapeHTML(value) {

    if (!value) return "";

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // START
  loadAccount();

</script>

</body>
</html>
